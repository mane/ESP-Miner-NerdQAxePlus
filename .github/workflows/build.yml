name: Build and Release ESP32 Firmware

permissions:
  contents: write

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
    strategy:
      matrix:
        include:
          - board: NERDQAXEPLUS
            upload_www: true
            label: NerdQAxePlus-LTS

    steps:
    - name: Checkout repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        submodules: recursive

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20.16.0
        cache: npm
        cache-dependency-path: main/http_server/axe-os/package-lock.json

    - name: Run firmware safety tests
      run: python3 -m unittest discover -s test -p '*test.py'

    - name: Install Web UI dependencies
      working-directory: main/http_server/axe-os
      run: npm ci

    - name: Run Web UI tests
      working-directory: main/http_server/axe-os
      run: |
        npm run test:build-tools
        npm test -- --watch=false --browsers=ChromeHeadless

    - name: Get Version Tag
      id: version_tag
      run: |
        git fetch --force --tags
        commit_hash=$(git rev-parse --short HEAD)
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          version="$GITHUB_REF_NAME"
          tagged_commit=$(git rev-list -n 1 "$version")
          if [ "$tagged_commit" != "$(git rev-parse HEAD)" ]; then
            echo "Tag $version does not resolve to the checked-out commit" >&2
            exit 1
          fi
          echo "IS_TAG_BUILD=true" >> "$GITHUB_ENV"
        else
          version="dev-${commit_hash}"
          echo "IS_TAG_BUILD=false" >> "$GITHUB_ENV"
        fi
        echo "VERSION_TAG=${version}" >> "$GITHUB_ENV"
        echo "COMMIT_HASH=${commit_hash}" >> "$GITHUB_ENV"
        echo "${version}" > version.txt
        echo "VERSION_TAG=${version}"

    - name: Build versioned Web UI
      working-directory: main/http_server/axe-os
      run: npm run build

    - name: Install GitHub CLI
      run: |
        sudo apt-get update -y
        sudo apt-get install -y gh

    - name: Check if release exists
      id: check_release
      run: |
        if [ "${{ env.IS_TAG_BUILD }}" = "true" ] && gh release view "${{ env.VERSION_TAG }}" >/dev/null 2>&1; then
          echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
        else
          echo "RELEASE_EXISTS=false" >> "$GITHUB_ENV"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set Target
      run: |
        # Run the Docker container to set ESP32-S3 target
        docker run --rm --user root -e BOARD=${{ matrix.board }} -e VERSION_TAG -e COMMIT_HASH -e GITHUB_ACTIONS=true -v "$PWD:/home/builder/project" \
        shufps/esp-idf-builder:0.0.1@sha256:08101278a9ab09568cda93cac5a4927a897cbe08b9008253f9472ca9d17d0917 idf.py set-target esp32s3

    - name: Compile Binaries
      run: |
        # Run the Docker container to build the project
        docker run --rm --user root -e BOARD=${{ matrix.board }} -e VERSION_TAG -e COMMIT_HASH -e GITHUB_ACTIONS=true -v "$PWD:/home/builder/project" \
        shufps/esp-idf-builder:0.0.1@sha256:08101278a9ab09568cda93cac5a4927a897cbe08b9008253f9472ca9d17d0917 idf.py build

    - name: Verify Web release artifacts
      run: |
        python3 scripts/verify_web_release.py \
          --version "$VERSION_TAG" \
          --commit "$COMMIT_HASH" \
          --dist main/http_server/axe-os/dist/axe-os \
          --www build/www.bin

    - name: Merge Binaries
      run: |
        docker run --rm --user root -v "$PWD:/home/builder/project" \
        shufps/esp-idf-builder:0.0.1@sha256:08101278a9ab09568cda93cac5a4927a897cbe08b9008253f9472ca9d17d0917 esptool.py --chip esp32s3 merge_bin --flash_mode dio --flash_size 16MB --flash_freq 80m \
        0x0 build/bootloader/bootloader.bin \
        0x8000 build/partition_table/partition-table.bin \
        0x10000 build/esp-miner.bin \
        0x410000 build/www.bin \
        0xf10000 build/ota_data_initial.bin \
        -o esp-miner-factory-${{ matrix.label }}-${{ env.VERSION_TAG }}.bin

    - name: Rename Build Artifacts
      run: |
        sudo mv build/esp-miner.bin build/esp-miner-${{ matrix.label }}.bin
        sudo mv build/esp-miner.elf build/esp-miner-${{ matrix.label }}.elf

    - name: Upload factory binary
      if: env.RELEASE_EXISTS == 'false'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: esp-miner-factory-${{ matrix.label }}-${{ env.VERSION_TAG }}.bin
        path: esp-miner-factory-${{ matrix.label }}-${{ env.VERSION_TAG }}.bin
        retention-days: 7

    - name: Upload BIN firmware
      if: env.RELEASE_EXISTS == 'false'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: esp-miner-${{ matrix.label }}.bin
        path: build/esp-miner-${{ matrix.label }}.bin
        retention-days: 7

    - name: Upload www.bin (only once)
      if: env.RELEASE_EXISTS == 'false' && matrix.board == 'NERDQAXEPLUS'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: www.bin
        path: build/www.bin
        retention-days: 7


    - name: Create files list
      run: |
        echo "esp-miner-factory-${{ matrix.label }}-${{ env.VERSION_TAG }}.bin" > file_list.txt
        echo "build/esp-miner-${{ matrix.label }}.bin" >> file_list.txt
        echo "build/esp-miner-${{ matrix.label }}.elf" >> file_list.txt
        if [ "${{ matrix.upload_www }}" == "true" ]; then
          echo "build/www.bin" >> file_list.txt
        fi

    - name: Set R2 files variable
      id: set_r2_files_var
      run: |
        echo "r2_files=$(tr '\n' ',' < file_list.txt)" >> "$GITHUB_ENV"

    # Skip release upload if no release exists
    - name: Skip release upload if not tagged
      if: env.RELEASE_EXISTS == 'false'
      run: echo "No GitHub release found for '${{ env.VERSION_TAG }}' — skipping release upload."

    - name: Upload to Existing Release
      if: env.RELEASE_EXISTS == 'true'
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
      with:
        files: |
          esp-miner-factory-${{ matrix.label }}-${{ env.VERSION_TAG }}.bin
          build/esp-miner-${{ matrix.label }}.bin
          build/www.bin
        fail_on_unmatched_files: true
        tag_name: ${{ env.VERSION_TAG }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install rclone
      if: env.RCLONE_CONF != ''
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash

    - name: Upload to Cloudflare R2 using rclone
      if: env.RCLONE_CONF != ''
      run: |
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

        TARGET_DIR="webflasher/${{ env.VERSION_TAG }}"

        echo "$r2_files" | tr ',' '\n' | grep -v '^$' | while read file; do
          rclone copyto "$file" "r2:${TARGET_DIR}/$(basename "$file")" --s3-acl public-read
        done
