name: Validate ESP32 Firmware on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - board: NERDQAXEPLUS
            label: NerdQAxePlus-LTS

    steps:
    - name: Checkout repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        submodules: recursive

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20.16.0
        cache: npm
        cache-dependency-path: main/http_server/axe-os/package-lock.json

    - name: Run firmware safety tests
      run: python3 -m unittest discover -s test -p '*test.py'

    - name: Install Web UI dependencies
      working-directory: main/http_server/axe-os
      run: npm ci

    - name: Run Web UI tests
      working-directory: main/http_server/axe-os
      run: |
        npm run test:build-tools
        npm test -- --watch=false --browsers=ChromeHeadless

    - name: Build versioned Web UI
      working-directory: main/http_server/axe-os
      run: |
        commit_hash=$(git rev-parse --short HEAD)
        VERSION_TAG="dev-${commit_hash}" COMMIT_HASH="$commit_hash" npm run build

    - name: Set Target for ${{ matrix.label }}
      run: |
        docker run --rm --user root -e BOARD=${{ matrix.board }} -e GITHUB_ACTIONS=true -v $PWD:/home/builder/project \
        shufps/esp-idf-builder:0.0.1@sha256:08101278a9ab09568cda93cac5a4927a897cbe08b9008253f9472ca9d17d0917 idf.py set-target esp32s3

    - name: Build firmware for ${{ matrix.label }}
      run: |
        docker run --rm --user root -e BOARD=${{ matrix.board }} -e GITHUB_ACTIONS=true -v $PWD:/home/builder/project \
        shufps/esp-idf-builder:0.0.1@sha256:08101278a9ab09568cda93cac5a4927a897cbe08b9008253f9472ca9d17d0917 idf.py build
